name: deploy-development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Keycloak Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/keycloak-flapi-theme:develop-${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.sha }}

      - name: Replace image tag in deployment.yaml for Kubernetes
        run: |
          echo DOCKER_HUB_USERNAME: ${{secrets.DOCKER_HUB_USERNAME}} | sed 's/./& /g'
          sed -i 's|\${TAG_VERSION}|develop-${{ github.sha }}|g' k8s/development-remote/deployment.yaml
          sed -i 's|\${DOCKER_HUB_USERNAME}|${{ secrets.DOCKER_HUB_USERNAME }}|g' k8s/development-remote/deployment.yaml

      - name: Debug remplacement tag
        run: |
          echo "Image remplacée par :"
          grep "image:" k8s/development-remote/deployment.yaml


      - name: Connect to the cluster K3S for deploy
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: |
            apply -f k8s/development-remote/namespace.yaml
            -f k8s/development-remote/certificate.yaml
            -f k8s/development-remote/mariadb-registry-secret.yaml
            -f k8s/development-remote/keycloack-admin-registry-secret.yaml
            -f k8s/development-remote/deployment.yaml
            -f k8s/development-remote/ingress.yaml
            -f k8s/development-remote/service.yaml

      - name: Inspect image dans deployment.yaml
        run: |
          echo "Image utilisée dans le YAML :"
          grep 'image:' k8s/development-remote/deployment.yaml

      - name: Force pod restart
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: rollout restart deployment/dev-auth-flapi-deployment -n dev-auth-flapi

      - name: Pause pour laisser le pod redémarrer
        run: sleep 10

      - name: Liste les pods après restart
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: get pods -n dev-auth-flapi -o wide

      - name: Wait for deployment to be ready
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: rollout status deployment/dev-auth-flapi-deployment -n dev-auth-flapi

      - name: Vérifie image utilisée dans le pod
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: get pod -n dev-auth-flapi -o jsonpath="{.items[0].spec.containers[0].image}"

      - name: Describe deployment
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: describe deployment/dev-auth-flapi-deployment -n dev-auth-flapi

      - name: Check présence du thème
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: exec -n dev-auth-flapi deploy/dev-auth-flapi-deployment -- ls -la /opt/keycloak/themes/flapi-theme/login





