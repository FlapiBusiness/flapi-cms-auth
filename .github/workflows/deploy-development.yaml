name: deploy-development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Apply DockerHub registry secret
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: apply -f k8s/development-remote/docker-registry-secret.yaml

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/development-remote/Dockerfile
          push: true
          tags: corentin35/auth-flapi:dev-${{ github.sha }}

      - name: Replace image tag in deployment.yaml for Kubernetes
        run: |
          sed -i 's/\${TAG_VERSION}/'${{ github.sha }}'/g' k8s/development-remote/deployment.yaml


      - name: Connect to the cluster K3S for deploy
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: |
            apply -f k8s/development-remote/namespace.yaml
            -f k8s/development-remote/certificate.yaml
            -f k8s/development-remote/mariadb-registry-secret.yaml
            -f k8s/development-remote/keycloack-admin-registry-secret.yaml
            -f k8s/development-remote/deployment.yaml
            -f k8s/development-remote/ingress.yaml
            -f k8s/development-remote/service.yaml
            
            
            - name: Pause pour laisser les pods démarrer
            
      - name: Pause pour laisser les pods démarrer
        run: sleep 15

      - name: Lister les pods dans le namespace
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: get pods -n dev-auth-flapi -o wide

      - name: Inspecter les événements du namespace
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: get events -n dev-auth-flapi --sort-by='.lastTimestamp'

      - name: Voir les logs du pod principal
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: logs -n dev-auth-flapi -l app=dev-auth-flapi --tail=100

      - name: Décrire le pod principal
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        with:
          args: describe pod -n dev-auth-flapi -l app=dev-auth-flapi






