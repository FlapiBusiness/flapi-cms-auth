services:
  keycloak:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command:
      - start-dev
      - --http-enabled=true
      - --hostname-strict=false
    volumes:
      - ./flapi-theme:/opt/keycloak/themes/flapi-theme:ro
