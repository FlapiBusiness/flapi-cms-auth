emailVerificationBody=Quelqu''un a créé un compte {2} avec cette adresse e-mail. Si c''était vous, cliquez sur le lien ci-dessous pour vérifier votre adresse e-mail.\n\n{0}\n\nCe lien expirera dans {3}.\n\nSi vous n''avez pas créé ce compte, ignorez simplement ce message.
passwordResetBody=Quelqu''un a demandé à changer les identifiants de votre compte {2}. Si c''est vous, cliquez sur le lien ci-dessous pour les réinitialiser.\n\n{0}\n\nCe lien et ce code expireront dans {3}.\n\nSi vous n''avez pas demandé la réinitialisation de vos identifiants, ignorez simplement ce message et rien ne sera modifié.